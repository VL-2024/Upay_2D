<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>UPAY 2D v0.1.17-alpha</title>
  <link rel="stylesheet" href="./src/styles.css?v=0117" />
  <link rel="stylesheet" href="./src/overrides-013d.css?v=0117" />
</head>
<body>
  <div id="appShell" class="shell">
    <div class="bg-layer"></div>
    <div id="pixiHost" class="pixi-host"></div>

    <header class="topbar">
      <div class="brand">X2<br><span>ЛОТЕРЕЯ</span></div>
      <div class="title-block">
        <div class="title">УПАЙ</div>
        <div class="subtitle">Выбивай чуко. Собирай тройки. Лови Хана!</div>
      </div>

      <div class="status-panel">
        <div class="pill balance-pill">
          <span>Баланс</span>
          <strong id="balanceValue">12 450 сом</strong>
        </div>

        <button class="pill stake-pill" id="stakeSelect" type="button" aria-expanded="false">
          <span>Ставка</span>
          <strong><span id="stakeValue">50</span> <span id="currencyValue">сом</span></strong>
          <span class="stake-arrow">▾</span>
        </button>
        <div class="stake-menu" id="stakeMenu" hidden></div>

        <div class="minor-status-row">
          <div class="minor-pill">№ <strong id="ticketValue">784321</strong></div>
          <label class="minor-pill toggle-pill">Демо
            <input id="demoToggle" type="checkbox" checked />
            <span class="toggle"></span>
          </label>
        </div>
      </div>
    </header>

    <aside class="side-tools">
      <button class="tool" type="button" aria-label="Звук">◖</button>
      <button class="tool" type="button" aria-label="Музыка">♪</button>
      <button class="tool" type="button" aria-label="Информация">i</button>
    </aside>

    <section class="objective" id="objective">Собери 3 чуко</section>

    <section class="upay-zones" aria-label="Поля УПАЙ">
      <div class="zone" id="upayZone1">
        <div class="zone-title">УПАЙ 1 <span class="zone-progress" id="zone1Progress">0/3</span></div>
        <div class="zone-slots" id="zone1"></div>
      </div>
      <div class="center-ornament">✦</div>
      <div class="zone" id="upayZone2">
        <div class="zone-title">УПАЙ 2 <span class="zone-progress" id="zone2Progress">0/3</span></div>
        <div class="zone-slots" id="zone2"></div>
      </div>
    </section>

    <section class="controls">
      <div class="action-row">
        <button class="icon-btn" id="autoBtn" type="button"><b>⟳</b><span>Автоигра</span></button>
        <button class="main-btn" id="newGameBtn" type="button">НОВАЯ ИГРА <small id="betLabel">50 сом</small></button>
        <button class="icon-btn" id="prizesBtn" type="button"><b>▣</b><span>Мои призы</span></button>
      </div>
    </section>

    <footer class="footer">БОЛЬШЕ, ЧЕМ ЛОТЕРЕЯ <b>X2</b> НАШИ ИГРЫ. НАША КУЛЬТУРА.</footer>
  </div>

  <script src="./src/gameplay-0116.js?v=0117"></script>
  <script src="./src/khan-strike-0117.js?v=0117"></script>
  <script type="module" src="./src/dom-main.js?v=0117"></script>
  <script src="./src/animation-hotfix-014a.js?v=0117"></script>
  <script src="./src/miss-slot-guard-0116.js?v=0117"></script>
</body>
</html>
